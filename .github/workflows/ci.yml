name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and bundle (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cheff-app-v3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cheff-app-v3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Expo project health check
        run: npx --yes expo-doctor

      # Proves the JavaScript bundle actually builds for Android
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir dist

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-js-bundle
          path: cheff-app-v3/dist/
          retention-days: 7

      # Report-only for now: the current lockfile has known advisories in
      # transitive Expo/React Native dependencies. Remove continue-on-error
      # once `npm audit` comes back clean to make this a hard gate.
      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
